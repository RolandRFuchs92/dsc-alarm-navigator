# tern migration configuration
#
# tern processes this file as a Go template (with Sprig functions and an
# `env` helper), so the database connection is pulled from the DATABASE_URL
# environment variable rather than hard-coded here. This keeps credentials
# out of version control and reuses the same DATABASE_URL the app uses.
#
# The npm scripts (see package.json) run tern through `scripts/tern.mjs`,
# which loads `.env` first so DATABASE_URL is populated. Passing `--test`
# to that wrapper swaps DATABASE_URL for TEST_DATABASE_URL.

[database]
conn_string = {{ env "DATABASE_URL" }}

# Table tern uses to track the applied migration version. Kept in the public
# schema and deliberately distinct from any application table.
version_table = public.schema_version
