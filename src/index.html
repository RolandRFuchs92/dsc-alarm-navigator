<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PC1864 Menu Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=Share+Tech+Mono&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <h1>PC1864 Menu Map</h1>
    <span class="model">DSC PowerSeries v4.x</span>
  </div>
  <div class="search" role="search">
    <input id="search" type="search" placeholder="Find a section: 105, entry delay, chime..." autocomplete="off" aria-label="Search sections and commands">
    <div id="search-results" class="search-results" hidden></div>
  </div>
</header>

<div class="layout">
  <nav class="tree" id="tree" aria-label="All menus">
    <button type="button" class="tree-toggle" id="tree-toggle" aria-expanded="false">Browse all menus <span aria-hidden="true">+</span></button>
    <div class="tree-body" id="tree-body"></div>
  </nav>

  <main class="main">
    <section class="panel where" id="where" aria-live="polite"></section>

    <div class="keypad-wrap">
      <div class="keypad" aria-label="Keypad simulator">
        <div class="keypad-head">
          <span class="keypad-brand">POWERSERIES</span>
          <div class="leds" id="leds">
            <span class="led ready"><i></i>READY</span>
            <span class="led armed"><i></i>ARMED</span>
            <span class="led trouble"><i></i>TROUBLE</span>
            <span class="led ac"><i></i>AC</span>
          </div>
        </div>
        <div class="lcd" id="lcd" aria-live="polite"></div>
        <div class="keys">
          <div class="scroll">
            <button type="button" data-key="&lt;" aria-label="Scroll left">&lt;</button>
            <button type="button" data-key="&gt;" aria-label="Scroll right">&gt;</button>
          </div>
          <button type="button" data-key="1">1</button>
          <button type="button" data-key="2">2</button>
          <button type="button" data-key="3">3</button>
          <button type="button" data-key="4">4</button>
          <button type="button" data-key="5">5</button>
          <button type="button" data-key="6">6</button>
          <button type="button" data-key="7">7</button>
          <button type="button" data-key="8">8</button>
          <button type="button" data-key="9">9</button>
          <button type="button" data-key="*">*</button>
          <button type="button" data-key="0">0</button>
          <button type="button" data-key="#">#</button>
        </div>
        <div class="keypad-foot">
          <button type="button" id="reset-keypad">Reset keypad</button>
          <button type="button" id="clear-entries">Clear my entries</button>
        </div>
      </div>
      <p class="keypad-note">Press the keys the same way as on your real keypad, or use your keyboard: digits, * and #. Esc works as #.</p>
    </div>

    <section class="panel detail" id="detail"></section>
  </main>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
